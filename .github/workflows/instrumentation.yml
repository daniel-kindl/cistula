name: Instrumentation

# Runs instrumentation smoke tests on emulators. Manual only: emulators are slow and use many
# Actions minutes. Run it before a release and for UI or platform changes:
#   gh workflow run Instrumentation --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: instrumentation (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: app
            api-level: 26
            target: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Free runner disk space
        # The emulator needs about 7.4 GB for its userdata partition. Remove preinstalled toolchains
        # that this build does not use.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        timeout-minutes: 15
        run: ./gradlew --console=plain --warning-mode=fail :${{ matrix.module }}:assembleDebug :${{ matrix.module }}:assembleDebugAndroidTest

      - name: Run instrumentation tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --console=plain --warning-mode=fail :${{ matrix.module }}:connectedDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-${{ matrix.module }}-reports
          path: ${{ matrix.module }}/build/reports/androidTests/
          retention-days: 7
