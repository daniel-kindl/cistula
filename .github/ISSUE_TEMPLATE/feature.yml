name: Feature request
description: Propose new behavior.
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: objective
    attributes: { label: Objective, description: What user problem does this solve? }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Scope }
    validations: { required: true }
  - type: textarea
    id: exclusions
    attributes: { label: Explicit exclusions }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria }
    validations: { required: true }
  - type: textarea
    id: tests
    attributes: { label: Required tests }
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes: { label: Dependencies, description: Issues, ADRs, or libraries this needs. }
  - type: textarea
    id: verification
    attributes: { label: Verification requirements, value: "`./eng/verify.sh` passes. CI passes." }
    validations: { required: true }
  - type: textarea
    id: privacy
    attributes: { label: Privacy and medical-safety impact }
