name: Bug report
description: Something does not work as documented.
title: "fix: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, account names, or other personal data."
  - type: textarea
    id: actual
    attributes: { label: What happens, description: Steps to reproduce and the actual result. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected result }
    validations: { required: true }
  - type: dropdown
    id: module
    attributes: { label: Module, options: [app, build or CI] }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, description: "Device, Android version, app version or commit." }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: How do we know it is fixed? Include the regression test. }
