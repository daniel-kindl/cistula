version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area:build]
    commit-message:
      prefix: "chore(deps)"
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-agp:
        patterns: ["org.jetbrains.kotlin*", "com.android.tools.build*", "com.android.application"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area:build]
    commit-message:
      prefix: "chore(ci)"
